[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-price-agent"
version = "0.1.0"
description = "A safe-mode mobile computer-use agent for cross-platform product comparison."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.8,<3",
    "httpx>=0.27,<1",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.48,<2",
]
dev = [
    "mypy>=1.11,<2",
    "pre-commit>=3.8,<5",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    "types-PyYAML>=6.0,<7",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
addopts = "-ra"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["backend/app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["backend"]
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
warn_unused_ignores = true

[tool.setuptools.packages.find]
where = ["backend"]
