name: 项目持续集成

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: 后端测试
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: python -m pip install -e . pytest
      - name: 编译检查
        run: python -m compileall -q backend/app backend/tests evaluation scripts
      - name: 执行后端测试
        run: python -m pytest

  android:
    name: ${{ matrix.project }} 测试与构建
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project:
          - android-client
          - mock-shopping-app
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
      - name: 安装 Android 34 组件
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: 配置 Gradle 9.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"
      - name: 执行测试并构建 Debug APK
        working-directory: ${{ matrix.project }}
        run: gradle test assembleDebug --no-daemon

  browser-e2e:
    name: 浏览器 Mock Web E2E
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装浏览器依赖
        run: |
          python -m pip install -e ".[browser]"
          python -m playwright install chromium-headless-shell
      - name: 执行本地 Mock Web 只读 E2E
        run: python scripts/run_browser_mock.py
