name: 项目持续集成

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    name: Python 质量门禁
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装 Python 质量工具
        run: python -m pip install -e ".[dev]"
      - name: Ruff 检查
        run: python -m ruff check backend/app backend/tests scripts --output-format concise
      - name: mypy 类型检查
        run: python -m mypy backend/app --show-error-codes
      - name: Python 编译检查
        run: python -m compileall -q backend/app backend/tests evaluation scripts
      - name: pre-commit 全量检查
        run: python -m pre_commit run --all-files

  python-test:
    name: Python 测试与覆盖率
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装 Python 测试依赖
        run: python -m pip install -e ".[dev]"
      - name: 执行后端测试
        run: python -m pytest -q
      - name: 执行分支覆盖率门禁
        run: |
          python -m coverage run --branch -m pytest -q
          python -m coverage report --fail-under=80

  browser-test:
    name: 浏览器 Mock Web E2E
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装浏览器依赖
        run: |
          python -m pip install -e ".[browser,dev]"
          python -m playwright install chromium-headless-shell
      - name: 执行本地 Mock Web 只读 E2E
        run: python scripts/run_browser_mock.py

  android-test-build:
    name: ${{ matrix.project }} 测试、Lint 与构建
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project:
          - android-client
          - mock-shopping-app
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3
      - name: 安装 Android 34 组件
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: 配置 Gradle 9.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"
      - name: 执行 unit test、lint 和 Debug 构建
        working-directory: ${{ matrix.project }}
        run: gradle test lintDebug assembleDebug --no-daemon --stacktrace
