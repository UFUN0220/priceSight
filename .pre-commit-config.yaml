repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff 静态检查
        entry: python -m ruff check backend/app backend/tests scripts
        language: system
        pass_filenames: false
      - id: python-compile
        name: Python 编译检查
        entry: python -m compileall -q backend/app backend/tests scripts
        language: system
        pass_filenames: false
